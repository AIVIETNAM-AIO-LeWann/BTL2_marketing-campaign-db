<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đăng nhập vào Campaign Desk để quản lý khoản chi và báo cáo chiến dịch marketing.">
  <title>Đăng nhập · Campaign Desk</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/login.css">
  <script type="module" src="/login.js"></script>
</head>
<body class="login-page">
  <div class="ambient" aria-hidden="true"></div>
  <button class="icon-button login-motion" type="button" data-ambient-toggle aria-label="Tạm dừng nền chuyển động" aria-pressed="false" title="Tạm dừng nền chuyển động"><svg aria-hidden="true"><use href="/icons.svg#pause"/></svg></button>
  <main class="login-layout">
    <aside class="login-intro" aria-label="Giới thiệu Campaign Desk">
      <div class="login-brand"><span class="brand-icon"><svg aria-hidden="true"><use href="/icons.svg#chart-no-axes-column-increasing"/></svg></span><strong>Campaign Desk</strong></div>
      <div class="login-art" aria-hidden="true">
        <div class="art-rings"><span class="art-orbit"></span></div>
        <div class="art-bars"><i></i><i></i><i></i><i></i><i></i></div>
        <span class="art-chip art-chip-receipt"><svg><use href="/icons.svg#receipt-text"/></svg></span>
        <span class="art-chip art-chip-target"><svg><use href="/icons.svg#target"/></svg></span>
      </div>
      <div class="login-intro-copy">
        <p class="login-product">Marketing đa kênh</p>
        <h2>Quản lý chi phí chiến dịch</h2>
        <p>Theo dõi khoản chi, ngân sách và chi phí chuyển đổi trong cùng một bảng điều khiển.</p>
      </div>
    </aside>

    <section class="login-side" aria-labelledby="login-title">
      <div class="login-brand mobile-brand"><span class="brand-icon"><svg aria-hidden="true"><use href="/icons.svg#chart-no-axes-column-increasing"/></svg></span><strong>Campaign Desk</strong></div>
      <div class="login-card">
        <div class="login-sign" aria-hidden="true"><svg><use href="/icons.svg#lock-keyhole"/></svg></div>
        <h1 id="login-title">Đăng nhập</h1>
        <p class="login-copy">Sử dụng tài khoản demo do nhóm cung cấp.</p>
        <form id="login-form" action="/api/login" method="post">
          <label for="username">Tên đăng nhập</label>
          <div class="login-field">
            <svg aria-hidden="true"><use href="/icons.svg#user-round"/></svg>
            <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Tên tài khoản" maxlength="64" required>
          </div>
          <label for="password">Mật khẩu</label>
          <div class="login-field password-field">
            <svg aria-hidden="true"><use href="/icons.svg#lock-keyhole"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" maxlength="1024" required>
            <button class="password-toggle" id="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-controls="password" title="Hiện mật khẩu"><svg aria-hidden="true"><use href="/icons.svg#eye"/></svg></button>
          </div>
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button id="login-submit" class="primary login-submit" type="submit">Đăng nhập</button>
          <noscript><p class="login-copy">Bật JavaScript trong trình duyệt để đăng nhập.</p></noscript>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
