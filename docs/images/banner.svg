<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Campaign Desk</title>
  <desc id="d">Hệ cơ sở dữ liệu và web quản lý chi phí chiến dịch marketing đa kênh</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/><stop offset=".55" stop-color="#101a3a"/><stop offset="1" stop-color="#2a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".25" r=".6">
      <stop offset="0" stop-color="#ffa95c" stop-opacity=".28"/><stop offset="1" stop-color="#ffa95c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc58a"/><stop offset="1" stop-color="#ff9a4d"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/></pattern>
  </defs>
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow)"/>
  <rect width="1280" height="340" rx="22" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1279" height="339" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

  <!-- logo mark -->
  <rect x="72" y="62" width="64" height="64" rx="16" fill="url(#bar)"/>
  <g fill="#1a1020"><rect x="90" y="92" width="7" height="20" rx="2"/><rect x="102" y="82" width="7" height="30" rx="2"/><rect x="114" y="98" width="7" height="14" rx="2"/></g>

  <text x="72" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Campaign Desk</text>
  <text x="74" y="236" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" fill="#c9d3ee">Quản lý chi phí chiến dịch marketing đa kênh</text>
  <text x="74" y="266" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#8fa0cc">Ràng buộc trong MySQL · Giao diện web · Triển khai bằng Docker</text>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#e8edfb">
    <rect x="74" y="288" width="118" height="30" rx="15" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/><text x="133" y="308" text-anchor="middle">MySQL 8.4</text>
    <rect x="204" y="288" width="112" height="30" rx="15" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/><text x="260" y="308" text-anchor="middle">Node.js 22</text>
    <rect x="328" y="288" width="104" height="30" rx="15" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/><text x="380" y="308" text-anchor="middle">Docker</text>
  </g>

  <!-- chart card -->
  <g transform="translate(790 56)">
    <rect width="420" height="228" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="28" y="44" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#aebbe0">Tổng chi theo bộ lọc</text>
    <text x="28" y="88" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-1">16.200.000 ₫</text>
    <g>
      <line x1="28" y1="186" x2="392" y2="186" stroke="#ffffff" stroke-opacity=".18"/>
      <rect x="44"  y="150" width="30" height="36" rx="7" fill="#ffffff" fill-opacity=".22"/>
      <rect x="92"  y="132" width="30" height="54" rx="7" fill="#ffffff" fill-opacity=".22"/>
      <rect x="140" y="152" width="30" height="34" rx="7" fill="#ffffff" fill-opacity=".22"/>
      <rect x="188" y="120" width="30" height="66" rx="7" fill="#ffffff" fill-opacity=".22"/>
      <rect x="236" y="138" width="30" height="48" rx="7" fill="#ffffff" fill-opacity=".22"/>
      <rect x="284" y="112" width="30" height="74" rx="7" fill="#ffffff" fill-opacity=".22"/>
      <rect x="332" y="100" width="30" height="86" rx="7" fill="url(#bar)"/>
    </g>
  </g>
</svg>
